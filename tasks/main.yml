---
# tasks file for lighthouse-role

- name: Lighthouse | Install system packages
  ansible.builtin.apt:
    name:
      - nginx
      - php-fpm
      - git
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Lighthouse | Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Lighthouse | Deploy main nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
    owner: root
    group: root
  notify:
    - Restart php-fpm
    - Restart nginx

- name: Lighthouse | Clone repository
  ansible.builtin.git:
    repo: "{{ lighthouse_vcs | default('https://github.com/VKCOM/lighthouse.git') }}"
    dest: "{{ lighthouse_location_dir | default('/usr/share/nginx/html/lighthouse') }}"
    version: master
    force: yes
  notify:
    - Restart php-fpm
    - Restart nginx

- name: Lighthouse | Deploy nginx vhost config
  ansible.builtin.template:
    src: lighthouse.conf.j2
    dest: /etc/nginx/conf.d/lighthouse.conf
    mode: '0644'
    owner: root
    group: root
  notify:
    - Restart php-fpm
    - Restart nginx

- name: Lighthouse | Ensure services are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
    daemon_reload: yes
  loop:
    - php8.1-fpm
    - nginx